[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yobi-backend"
version = "0.1.0"
description = "Evidence-grounded YOBI demo ordering backend"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "eval-type-backport>=0.2.2,<1; python_version < '3.10'",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "openai>=1.99,<2",
  "oracledb>=3.3,<4",
  "Pillow>=11.3,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
